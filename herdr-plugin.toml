id = "dev.deemwar.herdr-expose"
name = "herdr-expose"
version = "0.1.0"
description = "Your Herdr panes in a browser or on your phone: one Go binary, embedded web UI, loopback-only with a tunnel you start."
min_herdr_version = "0.9.0"
# Windows is EXPERIMENTAL, and as of 2026-09-20 VERIFIED END TO END on Windows
# arm64 (with Herdr 0.9.1 itself running as x86_64 under emulation): the named
# pipe transport, LockFileEx locking, Job Object process-tree kill, doctor,
# serve, the embedded web UI, share --lan, and an agent using the herdr-share
# skill to share its own session all work on real hardware.
#
# TWO THINGS ARE NOT PROVEN, and the doc says so check by check:
#   * `service install` as an ELEVATED Windows Service (only the unelevated
#     refusal is verified);
#   * `herdr plugin install` itself, which needs git and a POSIX shell that
#     Windows does not ship -- so on Windows this currently installs only if
#     you hand-build and hand-copy the binary.
# Read docs/windows.md before relying on any of this.
platforms = ["macos", "linux", "windows"]

# Builds the React app, then the Go binary with the app embedded in it.
# node and go are build-time only and OPTIONAL: with them the script builds from
# the cloned source; without them it falls back to the prebuilt release asset for
# this platform and verifies it against the release SHA256SUMS. Either way the
# install ends with ./bin/herdr-expose in place, and nothing is needed at run
# time. Herdr runs this once, at `plugin install`, before it registers anything;
# a non-zero exit aborts the install.
[[build]]
command = ["./scripts/build.sh"]

# Startup hooks are one-shot and unsupervised, so `daemon` fork-execs the real
# server and returns immediately. `serve` holds an exclusive flock on the
# pidfile, which makes a repeated hook (every session restore) harmless.
[[startup]]
command = ["./bin/herdr-expose", "daemon"]

# Every action / pane / link-handler id is namespaced `hex:` because
# `herdr plugin action invoke` takes --plugin as OPTIONAL, so a bare `open`
# collides with any other plugin defining one. Verified on 0.9.0: `:` is a legal
# id character, `.` is rejected (invalid_plugin_action_id). See docs/adr/0025.
[[actions]]
id = "hex:open"
title = "Open herdr-expose"
description = "Open the local web UI in your browser"
command = ["./bin/herdr-expose", "open"]
contexts = ["global"]

[[actions]]
id = "hex:pair"
title = "Pair a device"
description = "Mint a single-use pairing code and show a QR to scan from a phone"
command = ["./bin/herdr-expose", "pair"]
contexts = ["global"]

[[actions]]
id = "hex:status"
title = "herdr-expose status"
description = "Server state, local URL, exposed URL, and paired devices"
command = ["./bin/herdr-expose", "status"]
contexts = ["global"]

# The skill install is ALSO done by scripts/build.sh, which Herdr runs at
# `plugin install` — so the one-command path stays one command. This action is
# the repair verb: run it after moving the checkout, after a manual
# `skill uninstall`, or on a second machine whose ~/.claude did not exist when
# the plugin was first built. It is a symlink, it is idempotent, and it refuses
# to clobber a real directory. See docs/adr/0036.
[[actions]]
id = "hex:install-skill"
title = "Install the herdr-share agent skill"
description = "Link skill/ into ~/.claude/skills (and ~/.agents/skills) so an agent can drive share"
command = ["./bin/herdr-expose", "skill", "install"]
contexts = ["global"]

[[actions]]
id = "hex:expose"
title = "Expose over a tunnel"
description = "Start the configured tunnel and print the public URL"
command = ["./bin/herdr-expose", "expose", "start"]
contexts = ["global"]

[[actions]]
id = "hex:unexpose"
title = "Stop exposing"
description = "Tear down the tunnel; the server stays up on loopback"
command = ["./bin/herdr-expose", "expose", "stop"]
contexts = ["global"]

# Opened by the `pair` action, or on its own, to show the pairing QR without
# leaving the TUI. Overlay so it floats above the current layout and closes
# without disturbing panes.
[[panes]]
id = "hex:pair-qr"
title = "Pair a device"
description = "Scan this QR from your phone to pair it with this machine"
command = ["./bin/herdr-expose", "pair", "--pane"]
# overlay takes the whole terminal area; width/height are only valid for popup
placement = "overlay"

# A small status pane: local URL, tunnel URL, connected clients.
[[panes]]
id = "hex:status"
title = "herdr-expose status"
description = "Live server and tunnel status"
command = ["./bin/herdr-expose", "status", "--watch"]
placement = "popup"
width = "70%"
height = 20

# Clicking a herdr-expose URL printed in any pane opens it in the UI rather than
# handing it to the system browser with no session.
[[link_handlers]]
id = "hex:expose-url"
title = "Open in herdr-expose"
pattern = "^https?://[^/]+/#/pane/"
action = "hex:open"
