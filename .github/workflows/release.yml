# Publish a release when a vX.Y.Z tag is pushed.
#
# One runner builds all six targets: the binary is CGO-free, so Go
# cross-compiles them and the embedded web app is identical in each.
#
# Windows (amd64 + arm64) is built here but not EXERCISED here — there is no
# Windows runner in this workflow, so the floor is cross-compiling and
# cross-vetting every target. Windows has been verified end to end on real
# hardware; docs/windows.md says check by check what was run and what was not.
#
# The artifacts are NOT signed or notarized. macOS Gatekeeper will quarantine a
# downloaded build; `xattr -d com.apple.quarantine ./herdr-expose` clears it.
# Anyone who would rather not trust a binary can build from source in one
# command — that is the default path in scripts/build.sh.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0 # scripts/build.sh stamps the version from git describe

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod rather than pinning one here. A pinned
          # 1.22 against a go.mod that said 1.25 is what failed the v0.1.0 tag
          # ("Command failed: go env GOPATH"), and a pin drifts silently every
          # time the module's toolchain moves.
          go-version-file: go.mod
          check-latest: true

      - name: Test
        run: go test ./...

      # Windows has no runner in this workflow, so the floor is enforced by
      # cross-compiling and cross-vetting every target. This is what stops a
      # Unix-only syscall landing in a shared file and silently breaking the
      # Windows build until somebody downloads it.
      - name: Cross-build and vet every target
        run: |
          set -eux
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${t%/*}" GOARCH="${t#*/}" go build ./...
            GOOS="${t%/*}" GOARCH="${t#*/}" go vet ./...
          done

      - name: Build the release matrix
        run: ./scripts/build.sh --release
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          {
            echo "Prebuilt binaries for macOS, Linux and Windows (amd64 + arm64),"
            echo "with the web UI embedded. Not signed or notarized."
            echo
            echo "Windows works and needs no Administrator rights — verified end to"
            echo "end on real hardware. See docs/windows.md for the check-by-check"
            echo "claim, including what was not run."
            echo
            echo "Install as a Herdr plugin:"
            echo
            echo '    herdr plugin install muthuishere/herdr-expose'
            echo
            echo "On macOS and Linux that builds from source when Go and node are"
            echo "present and falls back to these binaries when they are not."
            echo "On Windows it builds from source only, and requires git plus Go"
            echo "1.25+ and node 20+ on PATH — there is no download fallback there,"
            echo "so a missing toolchain fails loudly rather than half-installing."
            echo
            echo "Or take a binary directly:"
            echo
            echo "    shasum -a 256 -c herdr-expose_${TAG}_SHA256SUMS"
            echo "    tar -xzf herdr-expose_${TAG}_darwin_arm64.tar.gz"
            echo "    ./herdr-expose daemon"
          } > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md \
            dist/*.tar.gz dist/*_SHA256SUMS
